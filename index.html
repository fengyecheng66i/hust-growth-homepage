品 · 陈若尘的成长主页","<h1>项目作品</h1><p class=\"lead\">每个项目写清问题、我负责的、技术、最大的困难。</p><div class=\"grid\" id=\"plist\"></div><h2>技能展示</h2><p class=\"lead\">只写用它做过什么，不写程度形容词。</p><div class=\"grid\"><article class=\"card\"><h3>C 语言</h3><p>数组、字符串、多文件工程、宏与条件编译、assert、选择排序和二分查找。证据：实验 5-2 成绩管理程序，用例全跑通；下面是按学号查人的函数。</p><pre class=\"code\" id=\"c-code\"></pre></article><article class=\"card\"><h3>OpenCL / GPU</h3><p>kernel、work size、event 计时、带宽换算。证据：把 92487 GB/s 定位到 work size 误用，重算后回到 515 GB/s。</p><pre class=\"code\">size_t items = global_size;\ndouble bytes = 2.0 * items * sizeof(float);\nprintf(\"%.2f GB/s\", bytes / (ms / 1000.0) / 1e9);</pre></article><article class=\"card\"><h3>Python 自动化</h3><p>python-docx 生成实验报告，python-pptx 做 18 页演讲 PPT。证据：实验 4、5-2 的报告与演讲 PPT。</p><pre class=\"code\">def replace(p, old, new):\n    for r in p.runs:\n        if old in r.text:\n            r.text = r.text.replace(old, new)</pre></article><article class=\"card\"><h3>英语精听</h3><p>每天三篇阅读加选择题，记错因并用句意改写补。证据：连续两次 9/9 后主动升难度，Day 04 掉到 9/12 后复盘。</p></article><article class=\"card\"><h3>写作与表达</h3><p>写过课程论文和演讲稿，先定“谁在说、说给谁”。证据：《长安是被讲出来的》论文、演讲 PPT。</p></article><article class=\"card\"><h3>工具链与调试</h3><p>w64devkit/GCC、VS Code、PowerShell、Git；遇到 PATH、编码、文件占用先定位再改。证据：独立配好编译环境。</p></article></div><h2>继续看</h2><div class=\"grid\"><a class=\"card\" href=\"contact.html\"><h3>联系方式与站点说明 →</h3><p>联系方式、可聊话题与部署说明。</p></a><a class=\"card\" href=\"study.html\"><h3>学习记录 →</h3><p>这些项目的原始记录。</p></a><a class=\"card\" href=\"index.html\"><h3>回到关于我 →</h3><p>我是谁、在学什么。</p></a></div>"],"contact.html":["联系我 · 陈若尘的成长主页","<h1>联系我</h1><p class=\"lead\">欢迎交流 C、OpenCL、文档自动化和英语学习。</p><div class=\"grid\"><div class=\"card\"><h3>✉️ 邮箱</h3><p>暂未公开，可经班级群找到我。</p></div><div class=\"card\"><h3>✎ 代码仓库</h3><p>还在整理，好后放链接。</p></div><div class=\"card\"><h3>🎓 学校</h3><p>华中科技大学 · 软件学院<br>软件工程（AI 大模型试验班）202604 班</p></div></div><h2>可以聊什么</h2><div class=\"grid\"><article class=\"card\"><h3>C 语言与实验报告</h3><p>数组、字符串、多文件工程、预处理；也可聊报告排版。</p></article><article class=\"ca
